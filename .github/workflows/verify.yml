name: Verify FieldOps
on:
  push:
    paths-ignore: ['docs/**', 'README.md', 'eval/results/**', 'eval/runs/**']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'eval/results/**', 'eval/runs/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_FREE_TIER_CONFIRMED: 'false'
      GROQ_ZDR_CONFIRMED: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npx tsx scripts/process.ts --prepare-ocr
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          FIELDOPS_TEST_DOCKER_POSTGRES: '1'
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 7
